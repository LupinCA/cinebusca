<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Busque filmes usando uma API real com filtros, favoritos e paginação."
  />

  <title>CineBusca</title>

  <link
    rel="icon"
    href="favicon.png"
  />

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <main class="app">

    <header class="topbar">

      <div class="brand">

        <div
          class="brand-mark"
          aria-hidden="true"
        >
          CB
        </div>

        <div>

          <h1>CineBusca</h1>

          <p class="subtitle">
            Busque filmes por título, gênero e nota
            usando uma API real.
          </p>

        </div>

      </div>

      <div
        class="status-pill"
        id="apiStatus"
      >
        Carregando API...
      </div>

    </header>

    <section
      class="controls"
      aria-label="Filtros de filmes"
    >

      <div class="field">

        <label for="searchInput">
          Pesquisar
        </label>

        <input
          id="searchInput"
          type="search"
          placeholder="Ex: Star Wars, Coco, Batman"
        />

      </div>

      <div class="field">

        <label for="genreSelect">
          Gênero
        </label>

        <select id="genreSelect">

          <option value="">
            Todos
          </option>

          <option value="Action">
            Ação
          </option>

          <option value="Comedy">
            Comédia
          </option>

          <option value="Drama">
            Drama
          </option>

          <option value="Horror">
            Terror
          </option>

          <option value="Sci-Fi">
            Ficção científica
          </option>

        </select>

      </div>

      <div class="field">

        <label for="sortSelect">
          Ordenar
        </label>

        <select id="sortSelect">

          <option value="rating-desc">
            Maior nota
          </option>

          <option value="rating-asc">
            Menor nota
          </option>

          <option value="title-asc">
            Título A-Z
          </option>

          <option value="title-desc">
            Título Z-A
          </option>

        </select>

      </div>

      <div class="field">

        <label>
          Ver
        </label>

        <div
          class="segmented"
          role="group"
          aria-label="Modo de visualização"
        >

          <button
            class="active"
            data-view="all"
            type="button"
          >
            Tudo
          </button>

          <button
            data-view="top"
            type="button"
          >
            Top
          </button>

          <button
            data-view="fav"
            type="button"
          >
            Salvos
          </button>

        </div>

      </div>

    </section>

    <div
      class="error"
      id="errorBox"
    ></div>

    <section
      class="toolbar"
      aria-live="polite"
    >

      <div>

        <h2 id="resultTitle">
          Filmes encontrados
        </h2>

        <p id="resultInfo">
          Aguarde enquanto os dados chegam.
        </p>

      </div>

      <button
        class="clear-button"
        id="clearButton"
        type="button"
      >
        Limpar filtros
      </button>

    </section>

    <section
      class="grid"
      id="movieGrid"
      aria-label="Lista de filmes"
    >

      <div class="loading">
        Carregando filmes...
      </div>

    </section>

    <div class="pagination">

      <button
        id="prevPage"
        aria-label="Página anterior"
      >
        ← Anterior
      </button>

      <span id="pageInfo">
        Página 1 de 1
      </span>

      <button
        id="nextPage"
        aria-label="Próxima página"
      >
        Próxima →
      </button>

    </div>

  </main>

  <div
    class="modal hidden"
    id="movieModal"
  >

    <div class="modal-content">

      <button
        class="close-modal"
        id="closeModal"
        aria-label="Fechar modal"
      >
        ✕
      </button>

      <div id="modalBody"></div>

    </div>

  </div>

  <footer class="footer">

    <p>
      Desenvolvido por Luisa Araujo
    </p>

  </footer>

  <script src="script.js"></script>

</body>
</html>
